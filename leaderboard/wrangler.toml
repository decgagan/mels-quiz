# Cloudflare Worker + D1 database for Mel's Quiz's shared leaderboard.
# See README.md in this folder for the exact commands to run.

name = "mels-quiz-leaderboard"
main = "src/index.js"
compatibility_date = "2025-06-01"

[[d1_databases]]
binding = "DB"
database_name = "mels-quiz-scores"
# >>> PASTE THE database_id THAT `wrangler d1 create` PRINTS BETWEEN THE QUOTES <<<
database_id = "7d624a73-ac62-45c2-9940-42c2d34ec4b7"
migrations_dir = "migrations"
